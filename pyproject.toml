[project]
name = "youtube-rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Frontend
    "streamlit>=1.57.0",
    # Development
    "ipykernel>=7.2.0",
    "notebook>=7.5.6",
    # Environment variables
    "python-dotenv>=1.2.2",
    # LangChain
    "langchain>=0.3.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.2",
    "langchain-chroma>=1.1.0",
    # LLM
    "langchain-google-genai>=4.2.2",
    # Vector Database
    "chromadb>=1.5.9",
    # Embeddings
    "sentence-transformers>=5.5.0",
    "langchain-huggingface>=1.2.2",
    # YouTube
    "youtube-transcript-api>=1.1.1",
    # Utilities
    "google-generativeai>=0.8.5",
    "pandas>=3.0.2",
    "numpy>=2.3.1",
    "tiktoken>=0.9.0",
    "pydantic>=2.11.7",
    "validators>=0.35.0",
    "rich>=14.0.0",
    "flask>=3.0.0",
    "flask-cors>=5.0.0",
]

[tool.pyright]
exclude = [".venv"]
extraPaths = ["."]
executionEnvironments = [
    { root = "." }
]


